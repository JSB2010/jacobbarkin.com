<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Credit Smoke Fixture</title>
  <style>
    body {
      margin: 0;
      min-height: 140vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 120px;
    }
    section {
      margin: 24px 0;
      padding: 24px;
      border: 1px solid #d1d5db;
      background: white;
    }
  </style>
  <script src="/embed/credit.js" data-auto data-variant="minimal" data-site="smoke-auto" data-no-rules></script>
  <script src="/embed/credit.js" data-no-rules></script>
</head>
<body>
  <main>
    <h1>JB Credit Smoke Fixture</h1>
    <section>
      <h2>Manual</h2>
      <jb-credit data-variant="chip" data-site="smoke-manual" data-no-rules></jb-credit>
    </section>
    <section>
      <h2>Data Only</h2>
      <jb-credit data-variant="data-only" data-site="smoke-data-only" data-no-rules></jb-credit>
    </section>
    <section>
      <h2>Fixed</h2>
      <jb-credit data-position="fixed" data-variant="text" data-site="smoke-fixed" data-no-rules></jb-credit>
    </section>
  </main>
</body>
</html>
