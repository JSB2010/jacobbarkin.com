name: "CodeQL Configuration for Next.js Portfolio"

# Paths to analyze
paths:
  - src

# Paths to exclude from analysis
paths-ignore:
  - node_modules
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/dist/**'
  - '**/build/**'
  - '**/.next/**'
  - '**/out/**'
  - '**/.open-next/**'
  - '**/public/**'
  - '**/*.d.ts'
  - 'scripts/**'

query-filters:
  # Exclude queries with high false positive rates in Next.js/React
  - exclude:
      id: js/xss-through-dom
  - exclude:
      id: js/incomplete-sanitization
  - exclude:
      id: js/missing-rate-limiting
  - exclude:
      id: js/insecure-randomness
  # Exclude slow queries that cause timeouts
  - exclude:
      id: js/request-forgery
  - exclude:
      id: js/regex/redos
  - exclude:
      id: js/prototype-pollution
  # Next.js specific exclusions
  - exclude:
      id: js/path-injection
  - exclude:
      id: js/client-side-unvalidated-url-redirection
  - exclude:
      id: js/server-side-unvalidated-url-redirection
