name: Test Suite

on:
  push:
    branches: [ main, modern-redesign-shadcn ]
  pull_request:
    branches: [ main, modern-redesign-shadcn ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --testPathIgnorePatterns=e2e
        continue-on-error: true

      - name: Run linting
        run: bun run lint
        continue-on-error: true

      - name: Run type check
        run: bun run typecheck
        continue-on-error: true
